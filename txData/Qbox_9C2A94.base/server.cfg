## BotRP | GTA V Enhanced
## txAdmin manages OneSync. Keep private credentials in server.local.cfg.

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
sv_maxclients 48
sv_scriptHookAllowed 0

sets tags "roleplay, serious-rp, qbox, international, enhanced"
sv_hostname "BotRP | Serious Roleplay"
sets sv_projectName "BotRP"
sets sv_projectDesc "A polished international serious-roleplay community."
sets locale "en-IN"
load_server_icon myLogo.png

# Required local configuration:
# Copy server.local.cfg.example to server.local.cfg and fill in your private values.
exec server.local.cfg

set resources_useSystemChat true
set qbx_chat:joinMessage "^2%s joined BotRP"
set qbx_chat:quitMessage "^1%s left BotRP (%s)"

voice_internal
exec voice.cfg
exec ox.cfg

setr qb_locale "en"
setr qbx:enableBridge "true"
set qbx:max_jobs_per_player 2
set qbx:max_gangs_per_player 2
set qbx:setjob_replaces "true"
set qbx:setgang_replaces "true"
set qbx:cleanPlayerGroups "true"
set qbx:allowMethodOverrides "true"
setr qbx:enableVehiclePersistence "true"
setr illenium-appearance:locale "en"
setr weather_disablecd true
setr loadscreen:externalShutdown true
set loadscreen:primaryColor "#e8edf2"
set loadscreen:shadowColor "#101216cc"

set npwd:framework "qbx"
set SCREENSHOT_BASIC_TOKEN ""
set NPWD_AUDIO_TOKEN ""

# Base resources supplied by this server build
ensure mapmanager
ensure chat
ensure spawnmanager
stop basic-gamemode
ensure baseevents

# Framework
ensure ox_lib
ensure qbx_core
ensure ox_target
ensure [ox]
ensure [qbx]
ensure [standalone]
ensure [voice]

# Phone
ensure [npwd-apps]
ensure qbx_npwd
ensure npwd

# BotRP
ensure botrp_core

exec permissions.cfg
exec misc.cfg
