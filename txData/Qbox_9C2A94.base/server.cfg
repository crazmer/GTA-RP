## NoPixel India | production server configuration
## Keep secrets out of Git. Set sv_licenseKey and mysql_connection_string locally.

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
set onesync on
sv_maxclients 48
sv_endpointprivacy true
set steam_webApiKey "none"

# Public server identity
sets tags "roleplay, serious-rp, qbox, international, india"
sv_hostname "NoPixel India | Serious Roleplay"
sets sv_projectName "NoPixel India"
sets sv_projectDesc "A polished, international serious-roleplay community with an Indian identity."
sets locale "en-IN"
load_server_icon myLogo.png
set sv_enforceGameBuild 3258

# REQUIRED LOCAL SECRETS
# Replace these placeholders on the host. Never commit real values to Git.
sv_licenseKey "CHANGE_ME"
set mysql_connection_string "mysql://USERNAME:PASSWORD@127.0.0.1:3306/DATABASE?charset=utf8mb4"

# Chat config
set resources_useSystemChat true
set qbx_chat:joinMessage "^2%s joined NoPixel India"
set qbx_chat:quitMessage "^1%s left NoPixel India (%s)"

# Voice config
exec voice.cfg

# Qbox config
setr qb_locale "en"
setr qbx:enableBridge "true"
set qbx:enableQueue "true"
set qbx:bucketLockdownMode "inactive"
set qbx:discordLink ""
set qbx:max_jobs_per_player 2
set qbx:max_gangs_per_player 2
set qbx:setjob_replaces "true"
set qbx:setgang_replaces "true"
set qbx:cleanPlayerGroups "true"
set qbx:allowMethodOverrides "true"
set qbx:disableOverrideWarning "false"
setr qbx:enableVehiclePersistence "true"
setr qbx:vehiclePersistenceType "semi"
set qbx:acknowledge "false"
setr qbx:enableGroupManagement "false"

# NoPixel India welcome message
setr qbx:motd "<p style='padding: 1rem; background-color: #101216; border: 1px solid #2b3038; border-radius: 0.75rem; text-align: center;'><strong style='color: #e8edf2;'>NoPixel India</strong><br><span style='color: #9da7b2;'>Build your character. Find your place. Create your story.</span></p>"

# Appearance
setr illenium-appearance:locale "en"

# Renewed-Weathersync
setr weather_disablecd true

# Ox resources
exec ox.cfg

# NPWD
set npwd:framework "qbx"
set SCREENSHOT_BASIC_TOKEN ""
set NPWD_AUDIO_TOKEN ""

# Loadscreen
setr loadscreen:externalShutdown true
set loadscreen:primaryColor "#e8edf2"
set loadscreen:shadowColor "#101216cc"

# Default resources
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
stop basic-gamemode
ensure hardcap
ensure baseevents

# Qbox & core dependencies
ensure ox_lib
ensure qbx_core
ensure ox_target
ensure [ox]
ensure [qbx]
ensure [standalone]
ensure [voice]
ensure [assets]

# Phone
ensure [npwd-apps]
ensure qbx_npwd
ensure npwd

# NoPixel India experience layer
ensure no_pixel_india

## Permissions
## Add your own identifier to permissions.cfg on the server host.
exec permissions.cfg

## Miscellaneous
exec misc.cfg
