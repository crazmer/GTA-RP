## BotRP | GTA V Enhanced server configuration
## Keep secrets out of Git. Set sv_licenseKey and mysql_connection_string locally.

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
set onesync on
sv_maxclients 48
set steam_webApiKey "none"
sv_scriptHookAllowed 0

# Public server identity
sets tags "roleplay, serious-rp, qbox, international, enhanced"
sv_hostname "BotRP | Serious Roleplay"
sets sv_projectName "BotRP"
sets sv_projectDesc "A polished, international serious-roleplay community."
sets locale "en-IN"
load_server_icon myLogo.png

# Local secrets: replace these values only on your host.
sv_licenseKey "CHANGE_ME"
set mysql_connection_string "mysql://USERNAME:PASSWORD@127.0.0.1:3306/DATABASE?charset=utf8mb4"

# Core configuration
set resources_useSystemChat true
set qbx_chat:joinMessage "^2%s joined BotRP"
set qbx_chat:quitMessage "^1%s left BotRP (%s)"
voice_internal

setr qb_locale "en"
setr qbx:enableBridge "true"
set qbx:enableQueue "true"
set qbx:bucketLockdownMode "inactive"
set qbx:discordLink ""
set qbx:max_jobs_per_player 2
set qbx:max_gangs_per_player 2
set qbx:setjob_replaces "true"
set qbx:setgang_replaces "true"
set qbx:cleanPlayerGroups "true"
set qbx:allowMethodOverrides "true"
set qbx:disableOverrideWarning "false"
setr qbx:enableVehiclePersistence "true"
setr qbx:vehiclePersistenceType "semi"
set qbx:acknowledge "false"
setr qbx:enableGroupManagement "false"
setr qbx:motd "<p style='padding:1rem;background:#101216;border:1px solid #2b3038;border-radius:.75rem;text-align:center'><strong style='color:#e8edf2'>BotRP</strong><br><span style='color:#9da7b2'>Build your character. Find your place. Create your story.</span></p>"
setr illenium-appearance:locale "en"
setr weather_disablecd true

exec ox.cfg

# Phone
set npwd:framework "qbx"
set SCREENSHOT_BASIC_TOKEN ""
set NPWD_AUDIO_TOKEN ""

# Loadscreen
setr loadscreen:externalShutdown true
set loadscreen:primaryColor "#e8edf2"
set loadscreen:shadowColor "#101216cc"

# Stock resources available in the base data set
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
stop basic-gamemode
ensure hardcap
ensure baseevents

# Qbox / Ox
ensure ox_lib
ensure qbx_core
ensure ox_target
ensure [ox]
ensure [qbx]
ensure [standalone]
ensure [voice]

# Phone
ensure [npwd-apps]
ensure qbx_npwd
ensure npwd

# BotRP experience layer
ensure botrp_core

## Permissions and miscellaneous host-local configuration
exec permissions.cfg
exec misc.cfg
