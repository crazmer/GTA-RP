## BotRP | GTA V Enhanced
## txAdmin manages OneSync. Keep private credentials in server.local.cfg.

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
sv_maxclients 48
sv_scriptHookAllowed 0

sets tags "roleplay, serious-rp, qbox, international, enhanced"
sv_hostname "BotRP | Serious Roleplay"
sets sv_projectName "BotRP"
sets sv_projectDesc "A polished international serious-roleplay community."
sets locale "en-IN"
load_server_icon myLogo.png

# Required local configuration:
# Copy server.local.cfg.example to server.local.cfg and fill in your private values.
exec server.local.cfg

set resources_useSystemChat true
set qbx_chat:joinMessage "^2%s joined BotRP"
set qbx_chat:quitMessage "^1%s left BotRP (%s)"

voice_internal
exec voice.cfg
exec ox.cfg

setr qb_locale "en"
setr qbx:enableBridge "true"
set qbx:max_jobs_per_player 2
set qbx:max_gangs_per_player 2
set qbx:setjob_replaces "true"
set qbx:setgang_replaces "true"
set qbx:cleanPlayerGroups "true"
set qbx:allowMethodOverrides "true"
setr qbx:enableVehiclePersistence "true"
setr illenium-appearance:locale "en"
setr weather_disablecd true

# Premium BotRP loading screen
setr loadscreen:externalShutdown true
set loadscreen:style "botrp"
set loadscreen:background "image"
set loadscreen:backgroundBrightness 42
set loadscreen:textColor "rgb(245, 248, 252)"
set loadscreen:primaryColor "rgb(42, 169, 255)"
set loadscreen:secondaryColor "rgb(34, 49, 63)"
set loadscreen:shadowColor "rgba(3, 8, 14, 0.74)"
set loadscreen:fontFamily "'Segoe UI', Arial, Helvetica, sans-serif"
set loadscreen:logo true
set loadscreen:serverMessage "${playerName}, welcome to ${serverName}."
set loadscreen:primaryBar true
set loadscreen:secondaryBar false
set loadscreen:loadingAction false
set loadscreen:finishingMessage "Finalizing your session..."
set loadscreen:logLine true
set loadscreen:finishedMessage "Ready"
set loadscreen:finishedLine "Entering the city..."
set loadscreen:audioControls true
set loadscreen:audioMuteKey "Space"
set loadscreen:rememberVolume true
set loadscreen:errorLog true
set loadscreen:initialAudioVolume 8
set loadscreen:music true
set loadscreen:musicShuffle false
set loadscreen:imageRate 9000
set loadscreen:imageShuffle false
set loadscreen:videoShuffle false

set npwd:framework "qbx"
set SCREENSHOT_BASIC_TOKEN ""
set NPWD_AUDIO_TOKEN ""

# Base resources supplied by this server build
ensure mapmanager
ensure chat
ensure spawnmanager
stop basic-gamemode
ensure baseevents

# Framework
ensure ox_lib
ensure qbx_core
ensure ox_target
ensure [ox]
ensure [qbx]
# qbx_hud is disabled after the [qbx] group is started so it cannot be
# restarted by the group and create a duplicate HUD/NUI layer.
stop qbx_hud
ensure [standalone]
ensure [voice]

# Phone
ensure [npwd-apps]
ensure qbx_npwd
ensure npwd

# BotRP - isolated resources
ensure botrp_core
ensure botrp_character
ensure botrp_hud

exec permissions.cfg
exec misc.cfg
