<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BotRP HUD</title><link rel="stylesheet" href="style.css">
</head>
<body>
<main id="hud" class="hud">
  <div class="brand"><span class="dot"></span><span>BOTRP</span></div>
  <div class="money"><div><small>CASH</small><strong id="cash">$0</strong></div><div><small>BANK</small><strong id="bank">$0</strong></div></div>
  <div id="job" class="job">Civilian <i>·</i> Freelancer</div>
  <div class="divider"></div>
  <div class="statuses">
    <div class="status"><span class="icon">♥</span><b id="health">100%</b></div>
    <div class="status"><span class="icon">◆</span><b id="armor">0%</b></div>
    <div class="status"><span class="icon">◒</span><b id="needs">--%</b></div>
    <div class="status"><span class="icon mic">●</span><b id="voice">Normal</b></div>
    <div class="status"><span class="icon">⌁</span><b id="ping">-- ms</b></div>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
