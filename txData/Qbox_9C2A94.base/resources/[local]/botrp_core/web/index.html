<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BotRP HUD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="hud" class="hud" aria-live="polite">
    <div class="brand"><span class="dot"></span>BOTRP</div>
    <div class="row">
      <div class="card"><span class="label">CASH</span><strong id="cash">$0</strong></div>
      <div class="card"><span class="label">BANK</span><strong id="bank">$0</strong></div>
    </div>
    <div class="job" id="job">Unemployed</div>
  </section>
  <script src="app.js"></script>
</body>
</html>
