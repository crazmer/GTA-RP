# BotRP loadscreen configuration
# This file can be executed with: exec @loadscreen/loadscreen.cfg

setr loadscreen:externalShutdown true

# BotRP custom premium style.
set loadscreen:style "botrp"

# Existing local GTA imagery, presented with a darker cinematic treatment.
set loadscreen:background "image"
set loadscreen:backgroundBrightness 42

set loadscreen:textColor "rgb(245, 248, 252)"
set loadscreen:primaryColor "rgb(42, 169, 255)"
set loadscreen:secondaryColor "rgb(34, 49, 63)"
set loadscreen:shadowColor "rgba(3, 8, 14, 0.74)"
set loadscreen:fontFamily "'Segoe UI', Arial, Helvetica, sans-serif"

set loadscreen:logo true
set loadscreen:serverMessage "${playerName}, welcome to ${serverName}."

set loadscreen:primaryBar true
set loadscreen:secondaryBar false
set loadscreen:loadingAction false

set loadscreen:finishingMessage "Finalizing your session..."
set loadscreen:logLine true
set loadscreen:finishedMessage "Ready"
set loadscreen:finishedLine "Entering the city..."

set loadscreen:audioControls true
set loadscreen:audioMuteKey "Space"
set loadscreen:rememberVolume true
set loadscreen:errorLog true
set loadscreen:initialAudioVolume 8

set loadscreen:music true
set loadscreen:musicShuffle false
set loadscreen:imageRate 9000
set loadscreen:imageShuffle false
set loadscreen:videoShuffle false

# Reserved for future hosted media support.
set loadscreen:embedLink ""
set loadscreen:embedAccess false
